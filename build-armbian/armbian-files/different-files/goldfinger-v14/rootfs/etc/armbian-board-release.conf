#!/bin/bash
# Goldfinger V14 board integration for the ophub Armbian rebuild framework.

# This image is intentionally locked to the validated Goldfinger profile.
BOARD_INSTALL_MODEL_ID="528"
BOARD_ALLOW_DIRECT_BOOT="yes"
BOARD_INSTALL_FILESYSTEM="ext4"
BOARD_COMPATIBILITY_ID="goldfinger-v14-2021-12-07"
BOARD_PCB_MARKING="GOLDFINGER_V14"
BOARD_PCB_DATE="2021-12-07"
default_ampart="no"

# The factory U-Boot has been proven to boot the ophub 6.12 kernel directly.
# Do not introduce an untested U-Boot overload into this board image.
adjust_kernel_files="yes"
adjust_kernel_files_cmd() {
    local base_dtb="${tag_bootfs}/dtb/amlogic/meson-sm1-x96-max-plus-100m.dtb"
    local board_dir="${tag_rootfs}/usr/share/goldfinger-v14"
    local work_dir="${tmp_build}/goldfinger-dtb"
    local base_dts="${work_dir}/base.dts"
    local board_dts="${work_dir}/board.dts"
    local output_dtb="${tag_bootfs}/dtb/amlogic/meson-sm1-goldfinger-v14-r6.dtb"
    local expected_base="386cdd6714f2e507db8b443c263c1a7d5fb7facc24bce9c8b2208d8bfe5c67eb"
    local expected_dts="3412fbc87bc9c30fbc13fe302513981dcadcf365ce88fd2eed4837d90f41e440"
    local expected_output="52bc2785e5c9e3c204e9feee20e3dff774f702880b6dd69489536f627b0bcfab"

    command -v dtc >/dev/null 2>&1 || error_msg "Goldfinger DTB build requires dtc."
    command -v patch >/dev/null 2>&1 || error_msg "Goldfinger DTB build requires patch."
    [[ -f "${base_dtb}" ]] || error_msg "Goldfinger base DTB is missing."
    echo "${expected_base}  ${base_dtb}" | sha256sum -c - >/dev/null ||
        error_msg "Goldfinger base DTB differs from the validated kernel input."

    mkdir -p "${work_dir}"
    dtc -I dtb -O dts -o "${base_dts}" "${base_dtb}" 2>/dev/null ||
        error_msg "Failed to decompile the Goldfinger base DTB."
    echo "${expected_dts}  ${base_dts}" | sha256sum -c - >/dev/null ||
        error_msg "Goldfinger base DTS representation differs from the validated input."

    cp "${base_dts}" "${board_dts}"
    patch -s -d "${work_dir}" -p1 <"${board_dir}/meson-sm1-goldfinger-v14-r6.patch" ||
        error_msg "Failed to apply the Goldfinger DTB patch."
    dtc -I dts -O dtb -o "${output_dtb}" "${board_dts}" 2>/dev/null ||
        error_msg "Failed to compile the Goldfinger DTB."
    echo "${expected_output}  ${output_dtb}" | sha256sum -c - >/dev/null ||
        error_msg "Goldfinger DTB output failed its pinned checksum."

    # This board uses the proven factory-U-Boot direct booti path.
    need_overload="no"
}

board_validate_rootfs() {
    local firmware_dir="usr/lib/firmware/brcm"
    local package_service="etc/systemd/system/multi-user.target.wants/goldfinger-v14-board-packages.service"
    local build_epoch_file="usr/lib/goldfinger-v14/image-build-epoch"

    [[ "${BOARD_COMPATIBILITY_ID}" == "goldfinger-v14-2021-12-07" &&
        "${BOARD_PCB_MARKING}" == "GOLDFINGER_V14" &&
        "${BOARD_PCB_DATE}" == "2021-12-07" ]] ||
        error_msg "Goldfinger PCB compatibility metadata is invalid."

    # This board has no battery-backed RTC. Give the installed image a trusted
    # lower bound that the offline installer can use before network time exists.
    date -u +%s >"${build_epoch_file}" ||
        error_msg "Could not record the Goldfinger image build time."
    [[ "$(cat "${build_epoch_file}")" =~ ^[0-9]{10}$ ]] ||
        error_msg "Goldfinger image build time is invalid."

    grep -q 'video=HDMI-A-1:1280x720@60e' "${tag_bootfs}/uEnv.txt" ||
        error_msg "Goldfinger boot configuration does not select the validated 720p mode."
    grep -q '^# 1080p alternative: replace 1280x720@60e with 1920x1080@60e in the APPEND line above\.$' "${tag_bootfs}/uEnv.txt" ||
        error_msg "Goldfinger boot configuration is missing the documented 1080p alternative."

    [[ -L lib && "$(readlink lib)" == "usr/lib" ]] ||
        error_msg "Goldfinger rootfs requires the usrmerge /lib -> usr/lib symlink."
    [[ -L bin && "$(readlink bin)" == "usr/bin" ]] ||
        error_msg "Goldfinger rootfs requires the usrmerge /bin -> usr/bin symlink."
    [[ -L sbin && "$(readlink sbin)" == "usr/sbin" ]] ||
        error_msg "Goldfinger rootfs requires the usrmerge /sbin -> usr/sbin symlink."

    echo "e59d485296365ca17bd7f9cfa7be390b0b58019ee9e2d59fb78445fa33d27d48  ${firmware_dir}/brcmfmac4359-sdio.amlogic,sm1.bin" |
        sha256sum -c - >/dev/null || error_msg "Goldfinger Wi-Fi firmware checksum failed in rootfs."
    echo "92d89e67df52b9ffebde9ae852bb54f3fa10d5e3f8b4b777c9ff2fc5dd5fbf29  ${firmware_dir}/brcmfmac4359-sdio.amlogic,sm1.txt" |
        sha256sum -c - >/dev/null || error_msg "Goldfinger Wi-Fi NVRAM checksum failed in rootfs."
    echo "afc05608aa0058cde4ddc0f51138ff1b7629997c9f53d67c4948838d783b1fa6  ${firmware_dir}/BCM4359C0.hcd" |
        sha256sum -c - >/dev/null || error_msg "Goldfinger Bluetooth firmware checksum failed in rootfs."
    echo "38751245389e1e23f73e6f5384b5cbe7fa972cc4410c5adc9c04b082a0b9561a  usr/share/doc/goldfinger-v14/firmware/NOTICE.rkwifibt" |
        sha256sum -c - >/dev/null || error_msg "Goldfinger AP6398S firmware notice is missing."
    echo "ced50bcaee2c563ba965ff5faa70ae54fc3e22b8ebc09ccf9474beed63eda9d4  usr/lib/goldfinger-v14/packages/bluez_5.72-0ubuntu5.5_arm64.deb" |
        sha256sum -c - >/dev/null || error_msg "Goldfinger BlueZ package checksum failed in rootfs."
    [[ -x usr/lib/goldfinger-v14/install-board-packages.sh ]] ||
        error_msg "Goldfinger first-boot package installer is missing or not executable."
    [[ -L "${package_service}" && "$(readlink "${package_service}")" == "/usr/lib/systemd/system/goldfinger-v14-board-packages.service" ]] ||
        error_msg "Goldfinger first-boot package service is not enabled."
}

# The installer sources this file on the running board. The build host does not.
if [[ -f /usr/lib/goldfinger-v14/install-functions.sh ]]; then
    source /usr/lib/goldfinger-v14/install-functions.sh
fi
