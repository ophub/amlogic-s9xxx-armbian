# Device-only customization; no fixed root UUID or host paths.
adjust_kernel_files="yes"
adjust_kernel_files_cmd() {
    local env_file="${tag_bootfs}/armbianEnv.txt"
    [ -f "${env_file}" ] || error_msg "Torder R10D: missing armbianEnv.txt"
    grep -q '^initrd_high=' "${env_file}" || printf '\ninitrd_high=0xffffffffffffffff\n' >> "${env_file}"
    grep -q '^fdt_high=' "${env_file}" || printf 'fdt_high=0xffffffffffffffff\n' >> "${env_file}"
    chmod 0755 "${tag_rootfs}/usr/local/sbin/torder-wifi-mac" \
        "${tag_rootfs}/usr/bin/torder-tablet-bluetooth" "${tag_rootfs}/usr/bin/hciattach_opi" 2>/dev/null
    chmod 0644 "${tag_rootfs}/usr/lib/systemd/system/torder-wifi-mac.service" \
        "${tag_rootfs}/usr/lib/systemd/system/torder-tablet-bluetooth.service" 2>/dev/null
    chown root:root "${tag_rootfs}/usr/bin/hciattach_opi" \
        "${tag_rootfs}/usr/bin/torder-tablet-bluetooth" "${tag_rootfs}/usr/local/sbin/torder-wifi-mac" \
        "${tag_rootfs}/usr/lib/systemd/system/torder-wifi-mac.service" \
        "${tag_rootfs}/usr/lib/systemd/system/torder-tablet-bluetooth.service" 2>/dev/null

    local units="${tag_rootfs}/etc/systemd/system"
    # Replace the obsolete board-local /etc unit from older Torder bases;
    # otherwise it overrides the corrected /usr unit and blocks coldplug.
    ln -sf /usr/lib/systemd/system/torder-wifi-mac.service "${units}/torder-wifi-mac.service"
    mkdir -p "${units}/sysinit.target.wants" "${units}/multi-user.target.wants" "${units}/getty.target.wants"
    ln -sf /usr/lib/systemd/system/torder-wifi-mac.service "${units}/sysinit.target.wants/torder-wifi-mac.service"
    ln -sf /usr/lib/systemd/system/torder-tablet-bluetooth.service "${units}/multi-user.target.wants/torder-tablet-bluetooth.service"
    ln -sf /usr/lib/systemd/system/serial-getty@.service "${units}/getty.target.wants/serial-getty@ttyFIQ0.service"

    # Reuse upstream INIs instead of duplicating them in the board overlay.
    local fw="${tag_rootfs}/usr/lib/firmware" ini
    for ini in wifi_56630001_2ant.ini wifi_56630001_3ant.ini bt_configure_pskey.ini \
        bt_configure_rf_marlin3e_2.ini bt_configure_rf_marlin3e_3.ini; do
        cp -f "${fw}/uwe5621ds/$ini" "${fw}/$ini" 2>/dev/null
    done
    cp -f "${fw}/uwe5621ds/bt_configure_rf_marlin3e_3.ini" "${fw}/bt_configure_rf.ini" 2>/dev/null
}
